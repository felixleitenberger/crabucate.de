<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>(function(){var d=document.documentElement,t;try{t=localStorage.getItem('theme')}catch(e){}if(t==='light'||t==='dark')d.dataset.theme=t;d.className+=' js'})();</script>
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#FBF6EF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#17120E" media="(prefers-color-scheme: dark)" />
  <title>Seite nicht gefunden — crabucate</title>
  <meta name="robots" content="noindex, follow" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #FBF6EF;
      --fg: #241F1A;
      --accent: #B04D1C;
      --muted: #6B6358;
      --line: rgba(176,77,28,0.15);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #17120E;
        --fg: #F3ECE3;
        --accent: #E98544;
        --muted: #A3998B;
        --line: rgba(233,133,68,0.22);
      }
    }
    :root[data-theme="dark"] {
      --bg: #17120E;
      --fg: #F3ECE3;
      --accent: #E98544;
      --muted: #A3998B;
      --line: rgba(233,133,68,0.22);
    }
    .nav-right { display: flex; align-items: center; gap: 1.25rem; }
    .theme-toggle {
      display: none; align-items: center; justify-content: center;
      width: 30px; height: 30px; padding: 0; border: 0; border-radius: 8px;
      background: none; color: var(--muted); cursor: pointer;
      transition: color 0.2s, background 0.2s;
    }
    html.js .theme-toggle { display: inline-flex; }
    .theme-toggle:hover { color: var(--fg); background: var(--line); }
    .theme-toggle svg { width: 16px; height: 16px; display: block; }
    .theme-toggle .ico-light, .theme-toggle .ico-dark { display: none; }
    :root[data-theme="light"] .theme-toggle .ico-auto { display: none; }
    :root[data-theme="light"] .theme-toggle .ico-light { display: block; }
    :root[data-theme="dark"] .theme-toggle .ico-auto { display: none; }
    :root[data-theme="dark"] .theme-toggle .ico-dark { display: block; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    nav {
      display: flex;
      align-items: center;
      padding: 1.2rem clamp(1.5rem, 6vw, 5rem);
      border-bottom: 1px solid var(--line);
    }

    .nav-logo {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--fg);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
    }

    .nav-logo img { width: 26px; height: 26px; border-radius: 6px; object-fit: cover; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem clamp(1.25rem, 4vw, 4rem);
      gap: 1rem;
    }

    .code {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 600; }

    p { color: var(--muted); font-size: 0.95rem; max-width: 34rem; }

    .links { display: flex; flex-wrap: wrap; gap: 1.25rem; justify-content: center; margin-top: 1rem; }
    .links a { color: var(--accent); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
    .links a:hover { text-decoration: underline; }

    footer {
      text-align: center;
      padding: 2.5rem 1rem 3.5rem;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid var(--line);
    }

    footer a { color: inherit; text-decoration: none; }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>

  <nav>
    <a class="nav-logo" href="/">
      <img src="/images/crabucateSquare.jpg" alt="" />
      crabucate
    </a>
    <div class="nav-right">
      <button class="theme-toggle" type="button" title="Design: automatisch" aria-label="Design: automatisch">
        <svg class="ico-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>
        <svg class="ico-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg>
        <svg class="ico-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </nav>

  <main>
    <span class="code">Fehler 404</span>
    <h1>Diese Seite gibt es nicht</h1>
    <p>
      Die Adresse führt ins Leere — vielleicht ein Tippfehler oder ein veralteter Link.
      <br />
      <em>This page doesn’t exist.</em>
    </p>
    <div class="links">
      <a href="/">Startseite</a>
      <a href="/platzwahl.html">Platzwahl</a>
      <a href="/team-zufall.html">Team Zufall</a>
      <a href="/en/">English</a>
    </div>
  </main>

  <footer>
    © 2026 crabucate · <a href="mailto:info@crabucate.de">info@crabucate.de</a> · <a href="/impressum.html">Impressum</a>
  </footer>

  <script>
  (function () {
    var root = document.documentElement;
    var btn = document.querySelector('.theme-toggle');
    if (!btn) return;
    var order = ['auto', 'light', 'dark'];
    var labels = { auto: 'Design: automatisch', light: 'Design: hell', dark: 'Design: dunkel' };

    function apply(mode) {
      if (mode === 'auto') {
        delete root.dataset.theme;
        try { localStorage.removeItem('theme'); } catch (e) {}
      } else {
        root.dataset.theme = mode;
        try { localStorage.setItem('theme', mode); } catch (e) {}
      }
      // <picture> und theme-color folgen sonst weiter dem Betriebssystem
      var q = function (isDark) {
        if (mode === 'auto') return isDark ? '(prefers-color-scheme: dark)' : '(prefers-color-scheme: light)';
        return isDark === (mode === 'dark') ? 'all' : 'not all';
      };
      document.querySelectorAll('picture source').forEach(function (s) {
        s.media = q(/-icon-dark\./.test(s.srcset));
      });
      document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
        m.media = q(m.content.toUpperCase() === '#17120E');
      });
      btn.title = labels[mode];
      btn.setAttribute('aria-label', labels[mode]);
    }

    btn.addEventListener('click', function () {
      apply(order[(order.indexOf(root.dataset.theme || 'auto') + 1) % 3]);
    });
    apply(root.dataset.theme || 'auto');
  })();
  </script>
</body>
</html>
