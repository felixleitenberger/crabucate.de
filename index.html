<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>crabucate — iOS-Apps für iPhone und iPad</title>
  <meta name="description" content="iOS-Apps von crabucate: Team Zufall und Platzwahl — einfach, lokal, ohne Ablenkung." />
  <link rel="canonical" href="https://crabucate.de/" />
  <link rel="alternate" hreflang="de" href="https://crabucate.de/" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://crabucate.de/" />
  <meta property="og:title" content="crabucate — iOS-Apps für iPhone und iPad" />
  <meta property="og:description" content="Kleine Apps für echte Probleme. Für iPhone und iPad." />
  <meta property="og:image" content="https://crabucate.de/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="de_DE" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --fg: #f0ece2;
      --accent: #c8b89a;
      --muted: #5a5650;
      --line: rgba(200,184,154,0.15);
      --card-bg: #111010;
      --tz: #F07D4A;
      --pw: #F5923A;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 1.2rem clamp(1.5rem, 6vw, 5rem);
      background: rgba(13,13,13,0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }

    .nav-logo {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--fg);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
    }

    .nav-logo img {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }

    /* ── MAIN ── */
    main {
      flex: 1;
      padding: calc(60px + 3.5rem) clamp(1.25rem, 4vw, 4rem) 5rem;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .page-eyebrow {
      text-align: center;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.1s forwards;
    }

    /* ── APP TILES GRID ── */
    .apps-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    @media (max-width: 680px) {
      .apps-grid { grid-template-columns: 1fr; }
    }

    /* ── SINGLE TILE ── */
    .app-tile {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 28px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      transition: transform 0.45s cubic-bezier(0.16,1,0.3,1), border-color 0.3s;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.16,1,0.3,1) var(--delay, 0.25s) forwards;
    }

    .app-tile--tz { --delay: 0.2s; }
    .app-tile--pw { --delay: 0.35s; }

    .app-tile--tz:hover { border-color: rgba(240,125,74,0.4); transform: translateY(-8px); }
    .app-tile--pw:hover { border-color: rgba(245,146,58,0.4); transform: translateY(-8px); }

    /* Top content area */
    .tile-content {
      padding: 2.25rem 2.5rem 1.75rem;
      flex-shrink: 0;
    }

    .tile-icon {
      width: 72px;
      height: 72px;
      border-radius: 17px;
      display: block;
      margin-bottom: 1.5rem;
    }

    .tile-icon--tz {
      background: linear-gradient(135deg, var(--tz), #c05520);
      box-shadow: 0 8px 24px rgba(240,125,74,0.25);
    }

    .tile-name {
      font-size: clamp(1.75rem, 3.5vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--fg);
      margin-bottom: 0.7rem;
    }

    .tile-tagline {
      font-size: clamp(0.85rem, 1.3vw, 0.95rem);
      line-height: 1.65;
      color: var(--muted);
      max-width: 36ch;
      margin-bottom: 1.75rem;
    }

    /* CTA row */
    .tile-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .tile-cta--tz { color: var(--tz); }
    .tile-cta--pw { color: var(--pw); }

    .tile-cta-badge img {
      height: 34px;
      width: auto;
      display: block;
      opacity: 0.9;
    }

    .tile-coming-soon {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--pw);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .tile-coming-soon::before {
      content: '';
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--pw);
      flex-shrink: 0;
      animation: pulse 2.5s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    /* Screenshot preview area */
    .tile-preview {
      flex: 1;
      position: relative;
      overflow: hidden;
      min-height: 240px;
    }

    /* Gradient fade from card bg into screenshot */
    .tile-preview::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 72px;
      background: linear-gradient(to bottom, var(--card-bg), transparent);
      z-index: 1;
      pointer-events: none;
    }

    .tile-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      transition: transform 0.55s cubic-bezier(0.16,1,0.3,1);
    }

    .app-tile:hover .tile-preview img {
      transform: scale(1.04) translateY(-6px);
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 2.5rem 1rem 3.5rem;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid var(--line);
      position: relative;
      z-index: 1;
    }

    footer a { color: inherit; text-decoration: none; transition: color 0.2s; }
    footer a:hover { color: var(--accent); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <nav>
    <span class="nav-logo">
      <img src="images/crabucateSquare.jpg" alt="" />
      crabucate
    </span>
  </nav>

  <main>
    <p class="page-eyebrow">Unsere Apps</p>

    <div class="apps-grid">

      <!-- TEAM ZUFALL -->
      <a href="team-zufall.html" class="app-tile app-tile--tz">
        <div class="tile-content">
          <img
            src="images/Team%20Zufall-iOS-Default-1024x1024%401x.png"
            alt="Team Zufall App Icon"
            class="tile-icon tile-icon--tz"
          />
          <h2 class="tile-name">Team Zufall</h2>
          <p class="tile-tagline">Gruppen zufällig in Teams aufteilen — in einer Sekunde.</p>
          <span class="tile-cta tile-cta--tz">Im App Store &nbsp;→</span>
        </div>
        <div class="tile-preview">
          <img
            src="images/AppStore%20Screenshots/Screenshots%20iPad/ipad-01-home.png"
            alt="Team Zufall App-Vorschau"
            loading="lazy"
          />
        </div>
      </a>

      <!-- PLATZWAHL -->
      <a href="platzwahl.html" class="app-tile app-tile--pw">
        <div class="tile-content">
          <img
            src="images/platzwahl-icon-1024.svg"
            alt="Platzwahl App Icon"
            class="tile-icon"
          />
          <h2 class="tile-name">Platzwahl</h2>
          <p class="tile-tagline">Sitzpläne für Lehrkräfte — automatisch erstellt, fair verteilt, druckfertig.</p>
          <span class="tile-coming-soon">Demnächst im App Store</span>
        </div>
        <div class="tile-preview">
          <img
            src="images/platzwahl/Platzwahl-01.png"
            alt="Platzwahl App-Vorschau"
            loading="lazy"
          />
        </div>
      </a>

    </div>
  </main>

  <footer>
    © 2026 crabucate · <a href="mailto:info@crabucate.de">info@crabucate.de</a> · <a href="impressum.html">Impressum</a>
  </footer>

</body>
</html>
