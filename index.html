<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>crabucate — Apps für den Unterricht</title>
  <meta name="description" content="Kleine, fokussierte Apps für Lehrerinnen und Lehrer." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --fg: #f0ece2;
      --accent: #c8b89a;
      --muted: #5a5650;
      --line: rgba(200,184,154,0.15);
      --card-bg: #111010;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem clamp(1.5rem, 6vw, 5rem);
      background: rgba(13,13,13,0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--fg);
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .nav-logo span { color: var(--accent); }

    .nav-logo img {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      background: #fff;
      object-fit: cover;
      flex-shrink: 0;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 2rem;
    }

    nav ul a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }

    nav ul a:hover { color: var(--accent); }

    /* ── HERO ── */
    .hero {
      padding: 8rem clamp(1.5rem, 9vw, 9rem) 3.5rem;
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .hero-eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.15s forwards;
    }

    .hero h1 {
      font-size: clamp(3rem, 8.5vw, 7.5rem);
      font-weight: 800;
      line-height: 1.0;
      letter-spacing: -0.04em;
      color: var(--fg);
      max-width: 14ch;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
    }

    .hero p {
      margin-top: 2rem;
      font-size: 0.95rem;
      line-height: 1.75;
      color: var(--muted);
      max-width: 48ch;
      opacity: 0;
      animation: fadeUp 1s ease 0.5s forwards;
    }

    /* ── APPS ── */
    #apps {
      padding: 3rem clamp(1.5rem, 9vw, 9rem) 10rem;
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .section-eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2.5rem;
    }

    .app-category { margin-bottom: 4rem; }

    .category-label {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 380px));
      gap: 1.5rem;
    }

    .app-card {
      display: block;
      text-decoration: none;
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 2.25rem;
      transition: border-color 0.3s, transform 0.3s;
      position: relative;
      overflow: hidden;
    }

    .app-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: radial-gradient(circle at 20% 20%, var(--glow, transparent), transparent 65%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
    }

    .app-card:hover { border-color: rgba(200,184,154,0.28); transform: translateY(-3px); }
    .app-card:hover::after { opacity: 1; }

    .app-card-icon {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      display: block;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, #f07d4a, #c05520);
    }

    .app-platform {
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .app-card h2 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--fg);
      letter-spacing: -0.02em;
      margin-bottom: 0.6rem;
    }

    .app-card p {
      font-size: 0.875rem;
      line-height: 1.65;
      color: var(--muted);
      margin-bottom: 1.75rem;
    }

    .app-card--soon {
      opacity: 0.45;
      pointer-events: none;
    }

    .app-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--fg);
      transition: gap 0.2s;
    }

    .app-card:hover .app-link { gap: 0.8rem; }

    /* ── IMPRESSUM ── */
    #impressum {
      border-top: 1px solid var(--line);
      padding: 5rem clamp(1.5rem, 9vw, 9rem);
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .imp-label {
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 3rem;
    }

    .imp-section { margin-bottom: 2.5rem; }

    .imp-section h2 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--fg);
      margin-bottom: 0.6rem;
    }

    .imp-section p,
    .imp-section address {
      font-style: normal;
      font-size: 0.875rem;
      line-height: 1.9;
      color: var(--muted);
    }

    .imp-section a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }

    .imp-section a:hover { border-color: var(--accent); }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 3rem 1rem 4rem;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid var(--line);
      position: relative;
      z-index: 1;
    }

    footer a { color: inherit; text-decoration: none; transition: color 0.2s; }
    footer a:hover { color: var(--accent); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-logo">
      <img src="images/crabucateSquare.jpg" alt="" />
      crabucate
    </a>
    <ul>
      <li><a href="#apps">Apps</a></li>
      <li><a href="impressum.html">Impressum</a></li>
    </ul>
  </nav>

  <header class="hero">
    <h1>Apps, die den Job erledigen.</h1>
  </header>

  <section id="apps">
    <div class="app-category">
      <div class="apps-grid">
        <a href="team-zufall.html" class="app-card" style="--glow: rgba(240,125,74,0.08)">
          <img src="images/Team%20Zufall-iOS-Default-1024x1024%401x.png" alt="Team Zufall" class="app-card-icon" />
          <p class="app-platform">iPhone · iPad</p>
          <h2>Team Zufall</h2>
          <p>Gruppen in Sekunden zufällig auf Teams verteilen. Ein Tippen — fertig.</p>
          <span class="app-link">
            Mehr erfahren
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2.5 6.5h8M7 3l3.5 3.5L7 10"/>
            </svg>
          </span>
        </a>
      </div>
    </div>


  </section>

  <footer>© 2026 crabucate · <a href="impressum.html">Impressum</a> · <a href="privacy.html">Datenschutz</a> · <a href="terms.html">Nutzungsbedingungen</a></footer>

</body>
</html>
